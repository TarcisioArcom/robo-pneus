name: Robô de preços de pneus

on:
  schedule:
    - cron: "0 19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robo-pneus
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pesquisar preços
        id: robo
        continue-on-error: true
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          EMAIL_USUARIO: ${{ secrets.EMAIL_USUARIO }}
          EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          URL_RELATORIO: https://tarcisioarcom.github.io/robo-pneus/
        run: python robo.py

      - name: Salvar resultados no repositório
        run: |
          git config user.name  "robo-pneus"
          git config user.email "robo-pneus@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Coleta de preços $(TZ=America/Sao_Paulo date +%F)"
          git push

      - name: Falhar se não houve ofertas ou o e-mail não foi enviado
        if: steps.robo.outcome == 'failure'
        run: exit 1
